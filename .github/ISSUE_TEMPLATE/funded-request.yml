name: Confirmed donation request
description: Request priority consideration using one unclaimed confirmed public transaction.
title: "[Funded request] "
body:
  - type: dropdown
    id: network
    attributes:
      label: Network
      options: [Bitcoin, Ethereum/EVM, Dogecoin]
    validations: {required: true}
  - type: input
    id: txid
    attributes:
      label: Public transaction hash
      description: Never post a seed phrase or private key.
    validations: {required: true}
  - type: textarea
    id: request
    attributes:
      label: Requested improvement
      description: Describe one bounded, public feature or fix.
    validations: {required: true}
  - type: markdown
    attributes:
      value: "The first valid public issue claiming an unclaimed confirmed transaction receives request attribution. A donation does not guarantee implementation, timing, ownership, returns, support, or preferential treatment. Confirm the asset and network before sending."

